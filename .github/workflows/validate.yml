name: Validate DataX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: node --check app.js
      - name: Check required static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s migrations/0001_initial.sql
