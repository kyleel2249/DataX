name: Validate DataX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run application and monetary-model checks
        run: npm run check
      - name: Check required static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s migrations/0001_initial.sql
          test -s migrations/0002_dtx_money_and_redemption.sql
          test -s tests/monetary-model.test.cjs
          test -s manifest.webmanifest
          test -s service-worker.js
          test -s android/app/src/main/AndroidManifest.xml
          test -s functions/api/auth/register.js
          test -s functions/api/wallet/transfer.js
          test -s functions/_middleware.js
          test -s migrations/0003_accounts_wallets_and_transfers.sql
